# Same variables and defaults as connect_postgres in src/mobility.
mobility:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'mobility') }}"
      user: "{{ env_var('POSTGRES_USER', 'mobility') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: core
      threads: 4

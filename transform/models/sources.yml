sources:
  - name: metadata
    tables:
      - name: fetch_attempt
      - name: schedule_load

  - name: staging
    tables:
      - name: schedule_calendar
      - name: schedule_calendar_date
      - name: schedule_route
      - name: schedule_stop
      - name: schedule_stop_time
      - name: schedule_trip
      - name: stop_time_update
      - name: trip_update
      - name: trip_update_snapshot
      - name: vehicle_position
        columns:
          # GTFS-RT makes vehicle.timestamp optional, and a position without it
          # gets no service date.
          - name: position_timestamp
            data_tests:
              - not_null:
                  config:
                    severity: warn

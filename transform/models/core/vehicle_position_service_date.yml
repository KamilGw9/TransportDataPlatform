unit_tests:
  - name: position_gets_service_date_of_nearest_scheduled_trip
    model: vehicle_position_service_date
    description: >
      2026-10-05 and 2026-10-06 are weekdays with the same service. Times are
      UTC; Kraków is UTC+2 until the clocks go back on 2026-10-25.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('staging', 'vehicle_position_snapshot')
        rows:
          - {snapshot_sha256: s1}
      - input: ref('vehicle_position_match')
        rows:
          - {snapshot_sha256: s1, entity_id: after_midnight, schedule_sha256: v1, trip_id: night, trip_found: true}
          - {snapshot_sha256: s1, entity_id: before_start, schedule_sha256: v1, trip_id: early, trip_found: true}
          - {snapshot_sha256: s1, entity_id: clock_change, schedule_sha256: v1, trip_id: sunday, trip_found: true}
          - {snapshot_sha256: s1, entity_id: equidistant, schedule_sha256: v1, trip_id: morning, trip_found: true}
          - {snapshot_sha256: s1, entity_id: no_service, schedule_sha256: v1, trip_id: unlisted, trip_found: true}
          - {snapshot_sha256: s1, entity_id: no_stop_times, schedule_sha256: v1, trip_id: stopless, trip_found: true}
          - {snapshot_sha256: s1, entity_id: unknown_trip, schedule_sha256: v1, trip_id: missing, trip_found: false}
      - input: source('staging', 'vehicle_position')
        rows:
          # 01:00 local on 2026-10-06.
          - {snapshot_sha256: s1, entity_id: after_midnight, position_timestamp: "2026-10-05 23:00:00+00"}
          # 23:55 local on 2026-10-05.
          - {snapshot_sha256: s1, entity_id: before_start, position_timestamp: "2026-10-05 21:55:00+00"}
          - {snapshot_sha256: s1, entity_id: clock_change, position_timestamp: "2026-10-25 07:05:00+00"}
          # 20:15 local, 11:45 from the end of the 2026-10-05 trip and from the
          # start of the 2026-10-06 one.
          - {snapshot_sha256: s1, entity_id: equidistant, position_timestamp: "2026-10-05 18:15:00+00"}
          - {snapshot_sha256: s1, entity_id: no_service, position_timestamp: "2026-10-05 12:00:00+00"}
          - {snapshot_sha256: s1, entity_id: no_stop_times, position_timestamp: "2026-10-05 12:00:00+00"}
          - {snapshot_sha256: s1, entity_id: unknown_trip, position_timestamp: "2026-10-05 12:00:00+00"}
      - input: source('staging', 'schedule_trip')
        rows:
          - {schedule_sha256: v1, trip_id: night, service_id: weekday}
          - {schedule_sha256: v1, trip_id: early, service_id: weekday}
          - {schedule_sha256: v1, trip_id: sunday, service_id: sunday}
          - {schedule_sha256: v1, trip_id: morning, service_id: weekday}
          - {schedule_sha256: v1, trip_id: unlisted, service_id: unlisted}
          - {schedule_sha256: v1, trip_id: stopless, service_id: weekday}
      - input: source('staging', 'schedule_stop_time')
        rows:
          # 24:30 to 25:10.
          - {schedule_sha256: v1, trip_id: night, arrival_seconds: 88200, departure_seconds: 88200}
          - {schedule_sha256: v1, trip_id: night, arrival_seconds: 90600, departure_seconds: 90600}
          # 00:05 to 00:40.
          - {schedule_sha256: v1, trip_id: early, arrival_seconds: 300, departure_seconds: 300}
          - {schedule_sha256: v1, trip_id: early, arrival_seconds: 2400, departure_seconds: 2400}
          # 08:00 to 08:30.
          - {schedule_sha256: v1, trip_id: sunday, arrival_seconds: 28800, departure_seconds: 28800}
          - {schedule_sha256: v1, trip_id: sunday, arrival_seconds: 30600, departure_seconds: 30600}
          # 08:00 to 08:30.
          - {schedule_sha256: v1, trip_id: morning, arrival_seconds: 28800, departure_seconds: 28800}
          - {schedule_sha256: v1, trip_id: morning, arrival_seconds: 30600, departure_seconds: 30600}
          - {schedule_sha256: v1, trip_id: unlisted, arrival_seconds: 50400, departure_seconds: 50400}
      - input: ref('service_date')
        rows:
          - {schedule_sha256: v1, service_id: weekday, service_date: "2026-10-05"}
          - {schedule_sha256: v1, service_id: weekday, service_date: "2026-10-06"}
          - {schedule_sha256: v1, service_id: sunday, service_date: "2026-10-25"}
    expect:
      rows:
        - {entity_id: after_midnight, service_date: "2026-10-05", trip_start: "2026-10-05 22:30:00+00"}
        - {entity_id: before_start, service_date: "2026-10-06", trip_start: "2026-10-05 22:05:00+00"}
        # The service day starts at 01:00 local, so 08:00 is 07:00 UTC.
        - {entity_id: clock_change, service_date: "2026-10-25", trip_start: "2026-10-25 07:00:00+00"}
        - {entity_id: equidistant, service_date: "2026-10-05", trip_start: "2026-10-05 06:00:00+00"}
        - {entity_id: no_service, service_date: null, trip_start: null}
        - {entity_id: no_stop_times, service_date: null, trip_start: null}

  - name: later_build_adds_positions_of_newly_matched_snapshots
    model: vehicle_position_service_date
    description: >
      s2 was matched after the previous build; s3 has no trip in the schedule
      and adds nothing.
    overrides:
      macros:
        is_incremental: true
    given:
      # As SQL: on a new database the table does not exist yet to take columns from.
      - input: this
        format: sql
        rows: SELECT 's1'::text AS snapshot_sha256
      - input: source('staging', 'vehicle_position_snapshot')
        rows:
          - {snapshot_sha256: s1}
          - {snapshot_sha256: s2}
          - {snapshot_sha256: s3}
      - input: ref('vehicle_position_match')
        rows:
          - {snapshot_sha256: s1, entity_id: vehicle_401, schedule_sha256: v1, trip_id: morning, trip_found: true}
          - {snapshot_sha256: s2, entity_id: vehicle_401, schedule_sha256: v1, trip_id: morning, trip_found: true}
          - {snapshot_sha256: s3, entity_id: vehicle_401, schedule_sha256: v1, trip_id: missing, trip_found: false}
      - input: source('staging', 'vehicle_position')
        rows:
          - {snapshot_sha256: s1, entity_id: vehicle_401, position_timestamp: "2026-10-05 06:00:00+00"}
          - {snapshot_sha256: s2, entity_id: vehicle_401, position_timestamp: "2026-10-05 06:01:00+00"}
          - {snapshot_sha256: s3, entity_id: vehicle_401, position_timestamp: "2026-10-05 06:02:00+00"}
      - input: source('staging', 'schedule_trip')
        rows:
          - {schedule_sha256: v1, trip_id: morning, service_id: weekday}
      - input: source('staging', 'schedule_stop_time')
        rows:
          - {schedule_sha256: v1, trip_id: morning, arrival_seconds: 28800, departure_seconds: 28800}
          - {schedule_sha256: v1, trip_id: morning, arrival_seconds: 30600, departure_seconds: 30600}
      - input: ref('service_date')
        rows:
          - {schedule_sha256: v1, service_id: weekday, service_date: "2026-10-05"}
    expect:
      rows:
        - {snapshot_sha256: s2, entity_id: vehicle_401, service_date: "2026-10-05"}

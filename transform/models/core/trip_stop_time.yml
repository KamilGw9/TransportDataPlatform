unit_tests:
  - name: trip_stop_time_counts_from_service_date_of_each_seen_trip
    model: trip_stop_time
    given:
      - input: ref('vehicle_position_service_date')
        rows:
          # Two positions of one trip instance give one set of stop times.
          - {schedule_sha256: v1, trip_id: night, service_date: "2026-10-05"}
          - {schedule_sha256: v1, trip_id: night, service_date: "2026-10-05"}
          - {schedule_sha256: v1, trip_id: night, service_date: "2026-10-06"}
          - {schedule_sha256: v1, trip_id: undated, service_date: null}
      - input: source('staging', 'schedule_stop_time')
        rows:
          # 23:50 and 24:30.
          - {schedule_sha256: v1, trip_id: night, stop_sequence: 1, stop_id: a, arrival_seconds: 85800, departure_seconds: 85800}
          - {schedule_sha256: v1, trip_id: night, stop_sequence: 2, stop_id: b, arrival_seconds: 88200, departure_seconds: 88260}
          - {schedule_sha256: v1, trip_id: undated, stop_sequence: 1, stop_id: a, arrival_seconds: 36000, departure_seconds: 36000}
    expect:
      # Kraków is UTC+2 on these dates.
      rows:
        - {trip_id: night, service_date: "2026-10-05", stop_sequence: 1, scheduled_arrival: "2026-10-05 21:50:00+00", scheduled_departure: "2026-10-05 21:50:00+00"}
        - {trip_id: night, service_date: "2026-10-05", stop_sequence: 2, scheduled_arrival: "2026-10-05 22:30:00+00", scheduled_departure: "2026-10-05 22:31:00+00"}
        - {trip_id: night, service_date: "2026-10-06", stop_sequence: 1, scheduled_arrival: "2026-10-06 21:50:00+00", scheduled_departure: "2026-10-06 21:50:00+00"}
        - {trip_id: night, service_date: "2026-10-06", stop_sequence: 2, scheduled_arrival: "2026-10-06 22:30:00+00", scheduled_departure: "2026-10-06 22:31:00+00"}

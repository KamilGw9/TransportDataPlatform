models:
  - name: scheduled_trip
    data_tests:
      - unique:
          arguments:
            column_name: "(service_date, trip_id)"

unit_tests:
  - name: date_gets_schedule_version_in_force_at_its_start
    model: scheduled_trip
    description: >
      Service days start at 22:00 UTC on the day before. v1 was archived late
      on 2026-10-13 and v2 at 14:37 UTC on 2026-10-16, renaming the trip from
      2026-10-17. 2026-10-13 started before any version, and 2026-10-18 after
      the latest download.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('metadata', 'fetch_attempt')
        rows:
          - {source_id: krakow_ztp_m, status: stored, sha256: v1, fetched_at: "2026-10-13 21:43:00+00"}
          - {source_id: krakow_ztp_m, status: failed, sha256: null, fetched_at: "2026-10-16 13:37:00+00"}
          - {source_id: krakow_ztp_m, status: stored, sha256: v2, fetched_at: "2026-10-16 14:37:00+00"}
          - {source_id: krakow_ztp_m, status: unchanged, sha256: v2, fetched_at: "2026-10-16 22:37:00+00"}
          - {source_id: krakow_ztp_m_vehicle_positions, status: stored, sha256: p1, fetched_at: "2026-10-18 12:00:00+00"}
      - input: source('metadata', 'schedule_load')
        rows:
          - {schedule_sha256: v1, status: loaded}
          - {schedule_sha256: v2, status: loaded}
      - input: ref('service_date')
        rows:
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-13"}
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-14"}
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-16"}
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-17"}
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-18"}
          - {schedule_sha256: v2, service_id: daily, service_date: "2026-10-16"}
          - {schedule_sha256: v2, service_id: daily, service_date: "2026-10-17"}
          - {schedule_sha256: v2, service_id: daily, service_date: "2026-10-18"}
      - input: source('staging', 'schedule_trip')
        rows:
          - {schedule_sha256: v1, trip_id: night_v1, route_id: "601", service_id: daily}
          - {schedule_sha256: v1, trip_id: stopless, route_id: "601", service_id: daily}
          - {schedule_sha256: v2, trip_id: night_v2, route_id: "601", service_id: daily}
      - input: source('staging', 'schedule_stop_time')
        rows:
          # 24:30 to 25:10.
          - {schedule_sha256: v1, trip_id: night_v1, arrival_seconds: 88200, departure_seconds: 88200}
          - {schedule_sha256: v1, trip_id: night_v1, arrival_seconds: 90600, departure_seconds: 90600}
          - {schedule_sha256: v2, trip_id: night_v2, arrival_seconds: 88200, departure_seconds: 88200}
          - {schedule_sha256: v2, trip_id: night_v2, arrival_seconds: 90600, departure_seconds: 90600}
    expect:
      rows:
        - {service_date: "2026-10-14", schedule_sha256: v1, trip_id: night_v1, trip_start: "2026-10-14 22:30:00+00", trip_end: "2026-10-14 23:10:00+00"}
        - {service_date: "2026-10-16", schedule_sha256: v1, trip_id: night_v1, trip_start: "2026-10-16 22:30:00+00", trip_end: "2026-10-16 23:10:00+00"}
        - {service_date: "2026-10-17", schedule_sha256: v2, trip_id: night_v2, trip_start: "2026-10-17 22:30:00+00", trip_end: "2026-10-17 23:10:00+00"}

  - name: date_waits_for_schedule_version_archived_before_it_starts
    model: scheduled_trip
    description: >
      v2 was archived before 2026-10-17 started but has not loaded, so the
      date is not added with v1 instead.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('metadata', 'fetch_attempt')
        rows:
          - {source_id: krakow_ztp_m, status: stored, sha256: v1, fetched_at: "2026-10-15 20:00:00+00"}
          - {source_id: krakow_ztp_m, status: stored, sha256: v2, fetched_at: "2026-10-16 21:30:00+00"}
          - {source_id: krakow_ztp_m, status: unchanged, sha256: v2, fetched_at: "2026-10-16 22:30:00+00"}
      - input: source('metadata', 'schedule_load')
        rows:
          - {schedule_sha256: v1, status: loaded}
          - {schedule_sha256: v2, status: failed}
      - input: ref('service_date')
        rows:
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-16"}
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-17"}
      - input: source('staging', 'schedule_trip')
        rows:
          - {schedule_sha256: v1, trip_id: morning, route_id: "143", service_id: daily}
      - input: source('staging', 'schedule_stop_time')
        rows:
          - {schedule_sha256: v1, trip_id: morning, arrival_seconds: 28800, departure_seconds: 28800}
    expect:
      rows:
        - {service_date: "2026-10-16", trip_id: morning}

  - name: later_build_adds_dates_after_the_latest_one
    model: scheduled_trip
    overrides:
      macros:
        is_incremental: true
    given:
      # As SQL: on a new database the table does not exist yet to take columns from.
      - input: this
        format: sql
        rows: SELECT '2026-10-16'::date AS service_date
      - input: source('metadata', 'fetch_attempt')
        rows:
          - {source_id: krakow_ztp_m, status: stored, sha256: v1, fetched_at: "2026-10-15 20:00:00+00"}
          - {source_id: krakow_ztp_m, status: unchanged, sha256: v1, fetched_at: "2026-10-16 22:30:00+00"}
      - input: source('metadata', 'schedule_load')
        rows:
          - {schedule_sha256: v1, status: loaded}
      - input: ref('service_date')
        rows:
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-16"}
          - {schedule_sha256: v1, service_id: daily, service_date: "2026-10-17"}
      - input: source('staging', 'schedule_trip')
        rows:
          - {schedule_sha256: v1, trip_id: morning, route_id: "143", service_id: daily}
      - input: source('staging', 'schedule_stop_time')
        rows:
          - {schedule_sha256: v1, trip_id: morning, arrival_seconds: 28800, departure_seconds: 28800}
    expect:
      rows:
        - {service_date: "2026-10-17", trip_id: morning}

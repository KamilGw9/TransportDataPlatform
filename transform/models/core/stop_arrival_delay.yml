unit_tests:
  - name: delay_is_range_between_window_bounds_and_schedule
    model: stop_arrival_delay
    description: Kraków is UTC+2 on 2026-10-05.
    given:
      - input: ref('stop_arrival')
        rows:
          - {schedule_sha256: v1, trip_id: t1, service_date: "2026-10-05", stop_sequence: 2, arrived_after: "2026-10-05 10:00:30+00", arrived_by: "2026-10-05 10:01:00+00"}
          - {schedule_sha256: v1, trip_id: t1, service_date: "2026-10-05", stop_sequence: 3, arrived_after: "2026-10-05 10:03:50+00", arrived_by: "2026-10-05 10:04:20+00"}
          # A stop sequence the schedule does not have keeps the arrival.
          - {schedule_sha256: v1, trip_id: t1, service_date: "2026-10-05", stop_sequence: 9, arrived_after: "2026-10-05 10:20:00+00", arrived_by: "2026-10-05 10:20:30+00"}
          # 00:30 local on 2026-10-06, on the trip of the 2026-10-05 service.
          - {schedule_sha256: v1, trip_id: night, service_date: "2026-10-05", stop_sequence: 2, arrived_after: "2026-10-05 22:30:30+00", arrived_by: "2026-10-05 22:31:00+00"}
      - input: source('staging', 'schedule_stop_time')
        rows:
          # 12:00, 12:05 and 24:30.
          - {schedule_sha256: v1, trip_id: t1, stop_sequence: 2, arrival_seconds: 43200}
          - {schedule_sha256: v1, trip_id: t1, stop_sequence: 3, arrival_seconds: 43500}
          - {schedule_sha256: v1, trip_id: night, stop_sequence: 2, arrival_seconds: 88200}
    expect:
      rows:
        - {trip_id: t1, stop_sequence: 2, scheduled_arrival: "2026-10-05 10:00:00+00", min_delay_seconds: 30, max_delay_seconds: 60}
        - {trip_id: t1, stop_sequence: 3, scheduled_arrival: "2026-10-05 10:05:00+00", min_delay_seconds: -70, max_delay_seconds: -40}
        - {trip_id: t1, stop_sequence: 9, scheduled_arrival: null, min_delay_seconds: null, max_delay_seconds: null}
        - {trip_id: night, stop_sequence: 2, scheduled_arrival: "2026-10-05 22:30:00+00", min_delay_seconds: 30, max_delay_seconds: 60}

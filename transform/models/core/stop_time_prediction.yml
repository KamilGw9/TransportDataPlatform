models:
  - name: stop_time_prediction
    data_tests:
      # Fails if a snapshot has a vehicle on the same trip twice, which would
      # mix two predictions in one series.
      - unique:
          arguments:
            column_name: "(trip_id, vehicle_id, stop_sequence, scheduled_arrival, in_force_from)"

unit_tests:
  - name: prediction_periods_end_at_changes_gaps_and_absences
    model: stop_time_prediction
    description: >
      Snapshots every 30 s from 10:00:00 to 10:01:30, then a gap until 10:10:00.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('staging', 'trip_update_snapshot')
        rows:
          - {snapshot_id: 1, feed_timestamp: "2026-10-05 10:00:00+00"}
          - {snapshot_id: 2, feed_timestamp: "2026-10-05 10:00:30+00"}
          - {snapshot_id: 3, feed_timestamp: "2026-10-05 10:01:00+00"}
          - {snapshot_id: 4, feed_timestamp: "2026-10-05 10:01:30+00"}
          - {snapshot_id: 5, feed_timestamp: "2026-10-05 10:10:00+00"}
          - {snapshot_id: 6, feed_timestamp: "2026-10-05 10:10:30+00"}
      - input: source('staging', 'trip_update')
        rows:
          - {snapshot_id: 1, entity_index: 0, trip_id: t1, vehicle_id: "601"}
          - {snapshot_id: 2, entity_index: 0, trip_id: t1, vehicle_id: "601"}
          - {snapshot_id: 3, entity_index: 0, trip_id: t1, vehicle_id: "601"}
          - {snapshot_id: 4, entity_index: 0, trip_id: t1, vehicle_id: "601"}
          - {snapshot_id: 5, entity_index: 0, trip_id: t1, vehicle_id: "601"}
          - {snapshot_id: 1, entity_index: 1, trip_id: t2, vehicle_id: "602"}
          - {snapshot_id: 2, entity_index: 1, trip_id: t2, vehicle_id: "602"}
          - {snapshot_id: 1, entity_index: 2, trip_id: t2, vehicle_id: "603"}
          - {snapshot_id: 2, entity_index: 2, trip_id: t2, vehicle_id: "603"}
      - input: source('staging', 'stop_time_update')
        rows:
          # The first stop has only a departure.
          - {snapshot_id: 1, entity_index: 0, stop_sequence: 1, arrival_time: null, arrival_delay: null}
          # Changes at 10:01:00 and is seen again after the gap.
          - {snapshot_id: 1, entity_index: 0, stop_sequence: 5, arrival_time: "2026-10-05 10:21:00+00", arrival_delay: 60}
          - {snapshot_id: 2, entity_index: 0, stop_sequence: 5, arrival_time: "2026-10-05 10:21:00+00", arrival_delay: 60}
          - {snapshot_id: 3, entity_index: 0, stop_sequence: 5, arrival_time: "2026-10-05 10:22:00+00", arrival_delay: 120}
          - {snapshot_id: 4, entity_index: 0, stop_sequence: 5, arrival_time: "2026-10-05 10:22:00+00", arrival_delay: 120}
          - {snapshot_id: 5, entity_index: 0, stop_sequence: 5, arrival_time: "2026-10-05 10:22:00+00", arrival_delay: 120}
          # Missing from snapshot 2.
          - {snapshot_id: 1, entity_index: 0, stop_sequence: 6, arrival_time: "2026-10-05 10:25:00+00", arrival_delay: 0}
          - {snapshot_id: 3, entity_index: 0, stop_sequence: 6, arrival_time: "2026-10-05 10:25:00+00", arrival_delay: 0}
          # Two vehicles on one trip.
          - {snapshot_id: 1, entity_index: 1, stop_sequence: 3, arrival_time: "2026-10-05 10:30:00+00", arrival_delay: 0}
          - {snapshot_id: 2, entity_index: 1, stop_sequence: 3, arrival_time: "2026-10-05 10:30:00+00", arrival_delay: 0}
          - {snapshot_id: 1, entity_index: 2, stop_sequence: 3, arrival_time: "2026-10-05 10:32:00+00", arrival_delay: 120}
          - {snapshot_id: 2, entity_index: 2, stop_sequence: 3, arrival_time: "2026-10-05 10:32:00+00", arrival_delay: 120}
    expect:
      rows:
        - {trip_id: t1, vehicle_id: "601", stop_sequence: 5, scheduled_arrival: "2026-10-05 10:20:00+00", predicted_arrival: "2026-10-05 10:21:00+00", in_force_from: "2026-10-05 10:00:00+00", in_force_until: "2026-10-05 10:01:00+00"}
        - {trip_id: t1, vehicle_id: "601", stop_sequence: 5, scheduled_arrival: "2026-10-05 10:20:00+00", predicted_arrival: "2026-10-05 10:22:00+00", in_force_from: "2026-10-05 10:01:00+00", in_force_until: "2026-10-05 10:03:30+00"}
        - {trip_id: t1, vehicle_id: "601", stop_sequence: 5, scheduled_arrival: "2026-10-05 10:20:00+00", predicted_arrival: "2026-10-05 10:22:00+00", in_force_from: "2026-10-05 10:10:00+00", in_force_until: "2026-10-05 10:10:30+00"}
        - {trip_id: t1, vehicle_id: "601", stop_sequence: 6, scheduled_arrival: "2026-10-05 10:25:00+00", predicted_arrival: "2026-10-05 10:25:00+00", in_force_from: "2026-10-05 10:00:00+00", in_force_until: "2026-10-05 10:00:30+00"}
        - {trip_id: t1, vehicle_id: "601", stop_sequence: 6, scheduled_arrival: "2026-10-05 10:25:00+00", predicted_arrival: "2026-10-05 10:25:00+00", in_force_from: "2026-10-05 10:01:00+00", in_force_until: "2026-10-05 10:01:30+00"}
        - {trip_id: t2, vehicle_id: "602", stop_sequence: 3, scheduled_arrival: "2026-10-05 10:30:00+00", predicted_arrival: "2026-10-05 10:30:00+00", in_force_from: "2026-10-05 10:00:00+00", in_force_until: "2026-10-05 10:01:00+00"}
        - {trip_id: t2, vehicle_id: "603", stop_sequence: 3, scheduled_arrival: "2026-10-05 10:30:00+00", predicted_arrival: "2026-10-05 10:32:00+00", in_force_from: "2026-10-05 10:00:00+00", in_force_until: "2026-10-05 10:01:00+00"}

  - name: later_build_recomputes_hours_of_newly_loaded_snapshots
    model: stop_time_prediction
    description: >
      Snapshots 1 and 2 were built before. Snapshot 3 was loaded late and is
      the earliest.
    overrides:
      macros:
        is_incremental: true
    given:
      # As SQL, so that the fixture does not depend on the columns of the
      # table in the database, which does not exist yet on a new one.
      - input: this
        format: sql
        rows: |
          SELECT timestamptz '2026-10-04 21:00+00' AS scheduled_arrival_hour, 2::bigint AS last_snapshot_id
          UNION ALL
          SELECT timestamptz '2026-10-04 22:00+00', 2
      - input: source('staging', 'trip_update_snapshot')
        rows:
          - {snapshot_id: 1, feed_timestamp: "2026-10-04 21:59:00+00"}
          - {snapshot_id: 2, feed_timestamp: "2026-10-04 21:59:30+00"}
          - {snapshot_id: 3, feed_timestamp: "2026-10-04 21:58:30+00"}
      - input: source('staging', 'trip_update')
        rows:
          - {snapshot_id: 1, entity_index: 0, trip_id: evening, vehicle_id: "601"}
          - {snapshot_id: 2, entity_index: 0, trip_id: evening, vehicle_id: "601"}
          - {snapshot_id: 1, entity_index: 1, trip_id: night, vehicle_id: "602"}
          - {snapshot_id: 2, entity_index: 1, trip_id: night, vehicle_id: "602"}
          - {snapshot_id: 3, entity_index: 0, trip_id: night, vehicle_id: "602"}
      - input: source('staging', 'stop_time_update')
        rows:
          # In an hour that no new snapshot touches.
          - {snapshot_id: 1, entity_index: 0, stop_sequence: 9, arrival_time: "2026-10-04 21:59:45+00", arrival_delay: 0}
          - {snapshot_id: 2, entity_index: 0, stop_sequence: 9, arrival_time: "2026-10-04 21:59:45+00", arrival_delay: 0}
          - {snapshot_id: 1, entity_index: 1, stop_sequence: 2, arrival_time: "2026-10-04 22:11:00+00", arrival_delay: 60}
          - {snapshot_id: 2, entity_index: 1, stop_sequence: 2, arrival_time: "2026-10-04 22:12:00+00", arrival_delay: 120}
          - {snapshot_id: 3, entity_index: 0, stop_sequence: 2, arrival_time: "2026-10-04 22:11:00+00", arrival_delay: 60}
    expect:
      rows:
        - {trip_id: night, scheduled_arrival_hour: "2026-10-04 22:00:00+00", predicted_arrival: "2026-10-04 22:11:00+00", in_force_from: "2026-10-04 21:58:30+00", in_force_until: "2026-10-04 21:59:30+00", last_snapshot_id: 3}
        - {trip_id: night, scheduled_arrival_hour: "2026-10-04 22:00:00+00", predicted_arrival: "2026-10-04 22:12:00+00", in_force_from: "2026-10-04 21:59:30+00", in_force_until: "2026-10-04 22:01:30+00", last_snapshot_id: 2}

  - name: hours_next_to_dates_missing_from_staging_are_not_computed
    model: stop_time_prediction
    description: >
      Staging has the window from 2026-10-03 and 2026-10-01 reloaded from RAW,
      but not 2026-09-30 or 2026-10-02. Only the arrival at 21:50 on
      2026-10-01 lies far enough from both missing dates.
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: sql
        rows: |
          SELECT timestamptz '2026-10-03 12:00+00' AS scheduled_arrival_hour, 1::bigint AS last_snapshot_id
      - input: source('staging', 'trip_update_snapshot')
        rows:
          - {snapshot_id: 1, feed_timestamp: "2026-10-03 12:00:00+00"}
          - {snapshot_id: 2, feed_timestamp: "2026-10-01 22:30:00+00"}
          - {snapshot_id: 3, feed_timestamp: "2026-10-01 03:00:00+00"}
      - input: source('staging', 'trip_update')
        rows:
          - {snapshot_id: 1, entity_index: 0, trip_id: live, vehicle_id: "601"}
          - {snapshot_id: 2, entity_index: 0, trip_id: evening, vehicle_id: "602"}
          - {snapshot_id: 2, entity_index: 1, trip_id: late_evening, vehicle_id: "603"}
          - {snapshot_id: 3, entity_index: 0, trip_id: night, vehicle_id: "604"}
      - input: source('staging', 'stop_time_update')
        rows:
          - {snapshot_id: 1, entity_index: 0, stop_sequence: 2, arrival_time: "2026-10-03 12:10:00+00", arrival_delay: 0}
          - {snapshot_id: 2, entity_index: 0, stop_sequence: 2, arrival_time: "2026-10-01 21:50:00+00", arrival_delay: 0}
          # Could also be predicted on 2026-10-02.
          - {snapshot_id: 2, entity_index: 1, stop_sequence: 2, arrival_time: "2026-10-01 23:10:00+00", arrival_delay: 0}
          # Could also be predicted on 2026-09-30.
          - {snapshot_id: 3, entity_index: 0, stop_sequence: 2, arrival_time: "2026-10-01 03:20:00+00", arrival_delay: 0}
    expect:
      rows:
        - {trip_id: evening, scheduled_arrival_hour: "2026-10-01 21:00:00+00", in_force_from: "2026-10-01 22:30:00+00", in_force_until: "2026-10-01 22:32:00+00", last_snapshot_id: 2}

[project]
name = "mobility"
version = "0.1.0"
description = "Urban transport data collection and analysis platform"
authors = [
    { name = "Kamil", email = "kamil.gwozdz9@interia.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=1.0,<2.0",
]

[project.scripts]
mobility = "mobility.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
  target-version = "py312"
  line-length = 88

  [tool.ruff.lint]
  select = ["E4", "E7", "E9", "F", "I"]

  [tool.pytest.ini_options]
  testpaths = ["tools/feed_profiler"]
  addopts = "--strict-config --strict-markers"
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  quality:
    name: Python quality checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run --locked ruff check src/ tools/feed_profiler/ scripts/ tests/ dags/

      - name: Check formatting
        run: uv run --locked ruff format --check src/ tools/feed_profiler/ scripts/ tests/ dags/

      - name: Run tests
        run: uv run --locked pytest

      - name: Check CLI
        run: |
          uv run --locked mobility --help
          uv run --locked mobility --version

      - name: Validate infrastructure configuration
        run: |
          make setup
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.aws.yaml config --quiet
          bash -n scripts/check_infrastructure.sh
          bash -n scripts/migrate.sh
          sh -n infrastructure/docker/minio/init.sh
          bash -n infrastructure/docker/airflow/init.sh
          sh -n infrastructure/docker/grafana/init.sh

      - name: Build application image
        run: docker build --tag mobility-app .

      - name: Check Airflow DAGs
        run: make check-dags

      - name: Test database constraints
        run: |
          docker compose up -d --wait postgres
          make migrate
          set -a; . ./.env; set +a
          uv run --locked pytest -m integration

      - name: Build and test dbt models
        run: make dbt-build

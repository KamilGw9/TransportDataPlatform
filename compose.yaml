name: urban-mobility

# Container-to-container addresses; the host ports in .env do not apply.
x-app-environment: &app-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Run make setup}
  POSTGRES_USER: ${POSTGRES_USER:?Run make setup}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
  S3_ENDPOINT_URL: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make setup}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make setup}
  S3_BUCKET: ${S3_BUCKET:-mobility}
  S3_REGION: ${S3_REGION:-us-east-1}

# Airflow's own metadata lives in a separate database on the same server.
x-airflow: &airflow
  build:
    context: .
    dockerfile: infrastructure/docker/airflow/Dockerfile
  image: mobility-airflow
  restart: unless-stopped
  environment:
    <<: *app-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    # Tasks authenticate to the API server with tokens signed by this secret,
    # so every Airflow component must share it.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Run make setup}
  volumes:
    - airflow_logs:/opt/airflow/logs
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run make setup}
      POSTGRES_USER: ${POSTGRES_USER:?Run make setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    build: ./infrastructure/docker/minio
    image: mobility-minio:2025-10-15
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make setup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make setup}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: mobility-minio:2025-10-15
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make setup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make setup}
      S3_BUCKET: ${S3_BUCKET:-mobility}
    volumes:
      - ./infrastructure/docker/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  collector:
    build: .
    image: mobility-app
    restart: unless-stopped
    command: ["mobility", "collect-realtime"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *app-environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  schedule-collector:
    build: .
    image: mobility-app
    restart: unless-stopped
    command: ["mobility", "collect-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *app-environment
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  airflow-init:
    <<: *airflow
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/airflow/init.sh:/init.sh:ro
    entrypoint: ["bash", "/init.sh"]

  airflow-api-server:
    <<: *airflow
    command: ["api-server"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # With the LocalExecutor, tasks run inside the scheduler container.
  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
